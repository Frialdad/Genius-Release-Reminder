<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Genius Release Reminder</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main id="calendar">
    <header>
      <button id="prev" class="icon" data-i18n-label="prevMonth">‹</button>
      <h1 id="month"></h1>
      <button id="next" class="icon" data-i18n-label="nextMonth">›</button>
      <button id="open-settings" class="icon" data-i18n-label="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </header>
    <div class="weekdays" id="weekdays"></div>
    <div id="grid"></div>
    <h2 id="list-title"></h2>
    <ul id="list"></ul>
  </main>

  <section id="settings" hidden>
    <header>
      <button id="close-settings" class="icon" data-i18n-label="back">‹</button>
      <h1 data-i18n="settings"></h1>
      <span class="icon"></span>
    </header>
    <fieldset>
      <legend data-i18n="language"></legend>
      <label><input type="radio" name="lang" value="en"> English</label>
      <label><input type="radio" name="lang" value="es"> Español</label>
    </fieldset>
    <fieldset>
      <legend data-i18n="theme"></legend>
      <label><input type="radio" name="theme" value="system"> <span data-i18n="system"></span></label>
      <label><input type="radio" name="theme" value="light"> <span data-i18n="light"></span></label>
      <label><input type="radio" name="theme" value="dark"> <span data-i18n="dark"></span></label>
    </fieldset>
  </section>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
